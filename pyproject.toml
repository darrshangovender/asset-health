[project]
name = "asset-health"
version = "0.1.1"
description = "Offline predictive-maintenance pipeline for mining assets: data-quality gating, regime-normalised features, explainable detection, RUL with uncertainty, cost-aware alerting and event-level evaluation on a seeded synthetic fleet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = [
    "predictive-maintenance",
    "condition-monitoring",
    "remaining-useful-life",
    "anomaly-detection",
    "industrial-iot",
    "mining",
    "reliability",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pydantic :: 2",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Parquet read/write for the file adapter. CSV works without it.
parquet = ["pyarrow>=15"]
# Optional LLM narrative for work orders (the only networked component; never needed offline).
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "pyarrow>=15",
    "ruff>=0.6",
]

[project.scripts]
asset-health = "asset_health.cli:main"

[project.urls]
Homepage = "https://github.com/darrshangovender/asset-health"
Repository = "https://github.com/darrshangovender/asset-health"
Issues = "https://github.com/darrshangovender/asset-health/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asset_health"]

[tool.hatch.build.targets.sdist]
include = ["asset_health", "tests", "benchmarks/run.py", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:sklearn.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS/Markdown template strings are clearer unwrapped.
"asset_health/report/*.py" = ["E501"]
"asset_health/evaluate/markdown.py" = ["E501"]
